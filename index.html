#banner {

    height: 200px;

    /* =========================
       NOW PLAYING
    ========================= */
    
    
    .top-player {
    min-height: 380px;
}

  .sticky-player {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: #1e1e1e;
}
    #nowPlaying {
        display: flex;
        align-items: center;
        gap: 5%;
        background-image: url('https://static.wikia.nocookie.net/shining-live/images/9/9a/Bg_Ai.png/revision/latest?cb=20190214231729');
        background-position: right center;
        background-repeat: no-repeat;
        background-size: cover;
        padding: 12px;
        box-sizing: border-box;
        
    }
    
    #nowArt {
        flex-shrink: 0;
        width: 200px;
        height: 200px;
   transform: translateX(150px);
        object-fit: cover;
        background-image: url(https://static.wikitide.net/utanoprincesamawiki/f/fe/A8f175e0726af13383510d8b412a6583.jpg?20231029221627);
        background-size:cover;
        background-position: center;
                border-radius: 12px;
                background-color: gray;
                z-index:99;
    }
                .border-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
}


    .now-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    #progressBar {
        width: 85%;
         z-index:920;
        
    }

    #nowTitle {
        font-size: 40px;
        font-weight: bold;
        color: black;
        margin-bottom: 7px;
         z-index:920;
           
    }
/* =====================================================
   FLOATING QUEUE
===================================================== */

#queueBox {
    position: fixed;
    right: 20px;
    top: 520px;
    width: 750px;
    z-index: 9999;
  background-color:black;
            background-color: rgba(0, 0, 0, 1);
    background-image:
        url("https://static.wikia.nocookie.net/shining-live/images/9/9a/Bg_Ai.png/revision/latest?cb=20190214231729");
        
    background-position: right center;
    background-repeat: no-repeat;
    background-size: cover;
    border-radius: 16px;
    padding: 12px;
    box-sizing: border-box;
    transition:
        width 0.25s ease,
        height 0.25s ease,
        border-radius 0.25s ease,
        padding 0.25s ease;
    overflow: hidden;
}

#queueBox::before {
    content: "";
    position: absolute;
    inset: 0;
    background: black;
    opacity: 0.4;
    z-index: 0;
    pointer-events:none;
}


/* =========================
   QUEUE HEADER
========================= */

.queue-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-weight: bold;
    color: black;
    font-size: 50px;
    font-weight: bold;
    margin-bottom: 4px;
    min-height: 0;
   
}


/* =========================
   BUTTONS
========================= */


.queue-buttons {
    display: flex;
    align-items: center;
    gap: 8px;

    /* DO NOT give this a huge width/height */
    width: auto;
    height: auto;
}


#queueBox .queue-buttons button {
    width: 100px;
    height: 100px;
    min-width: 40px;
    min-height: 40px;
    margin: 0;
    padding: 0;
    background: #333;
    border: none;
    border-radius: 50%;
    color: #ddd;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}


#queueBox .queue-buttons button:hover {
    background: #444;
    color: white;
}


/* =========================
   QUEUE LIST
========================= */

#queueList {
    display: flex;
    flex-direction: column;
    gap: 5px;
    max-height: 650px;
    overflow-y: auto;
    opacity: 1;
    transition:
        max-height 0.25s ease,
        opacity 0.2s ease;
}


/* =========================
   QUEUE SONG
========================= */

.queue-song {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #333;
    padding: 0px 0px;
    border-radius: 8px;
    font-size: 20px;
    cursor: pointer;
    transition:
        background 0.15s;
}
.queue-song:hover {
    background: #333;
}
.queue-song-name {
    height: 50px;
    color: white;
    overflow: hidden;
    display: flex;
    align-items: center;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex: 1;
}
.queue-remove {
    width: 40px;
    height: 40px;
    border: none;
    background: none;
    color: #888;
    cursor: pointer;
    font-size: 28px;
    margin-left: 10px;
    padding: 0;
}
.queue-remove:hover {
    color: white;
}

/* =========================
   SCROLLBAR
========================= */
#queueList::-webkit-scrollbar {
    width: 6px;
}
#queueList::-webkit-scrollbar-thumb {
    background: #555;
    border-radius: 6px;
}

/* =====================================================
   COLLAPSED QUEUE
===================================================== */

#queueBox.collapsed {
     position: fixed;
    right: 20px;
    top: 600px;
    width: 200px;
    height: 200px;
    right: 20px;
    bottom: 20px;
    padding: 0;
    border-radius: 150%;
    cursor: pointer;
}


/* Hide everything except toggle */

#queueBox.collapsed .queue-header {
    width: 100%;
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}


/* Hide "Queue" text */

#queueBox.collapsed .queue-header > span {
    display: none;
    font-size:50px;
}


/* Hide Clear button */

#queueBox.collapsed .clearqueue {
    display: none;
}


/* Make toggle into the circle */

#queueBox.collapsed #queueToggle {
    width: 200px;
    height: 200px;
    min-width: 100px;
    min-height: 100px;
    padding: 0;
    margin: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

/* Hide queue contents */

#queueBox.collapsed #queueList {
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    margin: 0;
}
    .controls {
    position: relative;
    text-align: center;
    justify-content: center;
    display: flex;
    align-items: flex-start;
    gap: 20px;
    background: #1e1e1e;
    padding: 15px;
    z-index: 50;
}

    .player-button {
        width: 125px;
        height: 125px;
        border-radius: 0%;
        background: #333;
        color: white;
        font-size: 40px;
        cursor: pointer;
        transition: 0.2s;
    }

    .player-button:hover {
        background: #555;
        transform: scale(1.08);
    }

    .player-button:active {
        transform: scale(0.95);
    }

    .player-button.active {
        transform: scale(1.05);
        opacity: 0.5;
        background-color: #111111;
    }

    .controls button {
        margin: 10px;
        padding: 18px 18px;
        border: none;
        border-radius: 500px;
        cursor: pointer;
    }

    .small-shuffle-button {
        width: 35px;
        height: 35px;
        border: none;
        border-radius: 50%;
        background: #333;
        color: white;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
    }

    /* =========================
       LIBRARY CONTROLS
    ========================= */

    .library-controls {
    position: absolute;
    left: 20px;
    top: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 0;
    margin: 0;
    transform: none;
    
}

    .library-controls label {
        color: #1a1a1a;
        font-family: sans-serif;
        font-size: 30px;
        font-weight: bold;
        margin-right: 8px;
    }

    #sortSelect {
        background: #1e1e1e;
        color: white;
        border: 0px solid #444;
        border-radius: 50px;
        padding: 30px 50px;
        cursor: pointer;
       font-size: 20px;
}
    #sortSelect:hover {
        background: #222;
        transform: scale(1.08);
    }

    /* =========================
       CATEGORY SECTIONS
    ========================= */

    .album-section {
        margin-bottom: 30px;
    }

    .album-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 24px;
        margin: 20px;
        padding-bottom: 8px;
        border-bottom: 1px solid #333;
        cursor: pointer;
        user-select: none;
        border: 20px white;
    }

    .album-title:hover {
        color: #1d1d1d;
    }

    .collapse-arrow {
        display: inline-block;
        font-size: 16px;
        transition: transform 0.2s;
    }

    .album-section.collapsed .collapse-arrow {
        transform: rotate(-90deg);
    }

    .album-title span {
        color: #777;
        font-size: 14px;
        font-weight: normal;
    }

    /* =========================
       SONG GRID
    ========================= */

    .text {
        font-size: 0px;
        font-weight: bold;
        color: black;
        text-align: center;
    }

    .song-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 10px;
        align-items: stretch;
        justify-content: center;
    }

    .song-card {
        width: 300px;
        min-height: 150%;
        padding: 15px;
        background-image: url("https://static.wikia.nocookie.net/shining-live/images/9/9a/Bg_Ai.png/revision/latest?cb=20190214231729");
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }

    .song-card img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        border-radius: 8px;
    }

    .song-card h3 {
        margin-bottom: 5px;
        font-size: 25px;
        font-family: "Futura Bold Rounded", sans-serif;
        font-weight: bold;
        color: black;
        text-align: center;
    }

    .song-card p {
        margin-top: 0;
        font-size: 15px;
        font-weight: bold;
        color: black;
        text-align: center;
    }

    .button-row {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
.small-button-row {
    display: flex;
    gap: 8px;
    width: 100%;
}

.small-button-row button {
    width: 50% !important;
    height: 45px !important;
    min-height: 45px !important;
    padding: 10px !important;
    margin: 0 !important;
    font-size: 15px !important;
    border-radius: 15px;
    box-sizing: border-box;
}
    .song-card button {
          font-size: 20px;
        width: 100%;
        height: 50px;
        padding: 10px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        box-sizing: border-box;
            transition: width 1s, height 1s;
    }
  .song-card button:hover {
    transform: scale(1.05);
}

/* Mobile */
@media (max-width: 768px) {
    body {
        zoom: 50%;
    }
}

/* Desktop */
@media (min-width: 769px) {
    body {
        zoom: 55%;
    }
}

</style>

function getArtistName(song) {

    if (
        Array.isArray(song.artist)
    ) {

        return song.artist.join(", ");

    }

    return song.artist || "Unknown Artist";

}

function createSongCards() {

    songCounter.textContent =
        songs.length +
        (
            songs.length === 1
                ? " Song"
                : " Songs"
        );


    songLibrary.innerHTML = "";


    const sortType =
        sortSelect.value;

    if (
        sortType === "none"
    ) {

        const grid =
            document.createElement(
                "div"
            );


        grid.className =
            "song-grid";


        for (
            let index = 0;
            index < songs.length;
            index++
        ) {

            createSongCard(
                songs[index],
                index,
                grid
            );

        }


        songLibrary.appendChild(
            grid
        );


        return;

    }
    const groups = {};


    for (
        let index = 0;
        index < songs.length;
        index++
    ) {

        const song =
            songs[index];


        let categories =
            song[sortType];
            
        if (
            (
                sortType === "artist" ||
                sortType === "album" ||
                sortType === "group"
            ) &&
            Array.isArray(categories)
        ) {

            for (
                let artistIndex = 0;
                artistIndex < categories.length;
                artistIndex++
            ) {

                let category =
                    categories[artistIndex];


                if (
                    category === undefined ||
                    category === ""
                ) {

                    category =
                        "Unknown";

                }


                if (
                    !groups[category]
                ) {

                    groups[category] = [];

                }


                groups[category].push(
                    index
                );

            }


            continue;

        }


        // =================================================
        // NORMAL SINGLE CATEGORY
        // =================================================

        if (
            categories === undefined ||
            categories === ""
        ) {

            categories =
                "Unknown";

        }


        if (
            !groups[categories]
        ) {

            groups[categories] = [];

        }


        groups[categories].push(
            index
        );

    }


    // =================================================
    // SORT CATEGORY NAMES
    // =================================================

    const categoryNames =
        Object.keys(
            groups
        );


    categoryNames.sort();


    // =================================================
    // CREATE SECTIONS
    // =================================================

    for (
        let i = 0;
        i < categoryNames.length;
        i++
    ) {

        const category =
            categoryNames[i];


        const section =
            document.createElement(
                "div"
            );


        section.className =
            "album-section";


        // =================================================
        // CATEGORY TITLE
        // =================================================

        const heading =
            document.createElement(
                "h2"
            );


        heading.className =
            "album-title";


        // Arrow

        const arrow =
            document.createElement(
                "span"
            );


        arrow.className =
            "collapse-arrow";


        arrow.textContent =
            "▼";


        // Category name

        const categoryName =
            document.createElement(
                "strong"
            );


        categoryName.textContent =
            category;


        // Song count

        const count =
            document.createElement(
                "span"
            );


        count.textContent =
            " (" +
            groups[category].length +
            " songs)";


        // =================================================
        // CATEGORY SHUFFLE BUTTON
        // =================================================

        const shuffleButton =
            document.createElement(
                "button"
            );


        shuffleButton.className =
            "player-button small-shuffle-button";


        shuffleButton.textContent =
            "🔀";


        shuffleButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                shuffleCategory(
                    groups[category]
                );

            }
        );


        heading.appendChild(
            shuffleButton
        );


        heading.appendChild(
            arrow
        );


        heading.appendChild(
            categoryName
        );


        heading.appendChild(
            count
        );


        section.appendChild(
            heading
        );


        // =================================================
        // CATEGORY SHUFFLE FUNCTION
        // =================================================

        function shuffleCategory(
            songIndexes
        ) {

            queue = [];


            for (
                let i = 0;
                i < songIndexes.length;
                i++
            ) {

                const index =
                    songIndexes[i];


                if (
                    songs[index]
                        .excludeFromShuffle
                ) {

                    continue;

                }


                queue.push(
                    index
                );

            }


            // Fisher-Yates shuffle

            for (
                let i = queue.length - 1;
                i > 0;
                i--
            ) {

                const random =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                [
                    queue[i],
                    queue[random]
                ] =
                [
                    queue[random],
                    queue[i]
                ];

            }


            updateQueue();


            nextSong();

        }


        // =================================================
        // SONG GRID
        // =================================================

        const grid =
            document.createElement(
                "div"
            );


        grid.className =
            "song-grid";


        for (
            let j = 0;
            j < groups[category].length;
            j++
        ) {

            const index =
                groups[category][j];


            createSongCard(
                songs[index],
                index,
                grid
            );

        }


        section.appendChild(
            grid
        );


        // =================================================
        // COLLAPSE FUNCTION
        // =================================================

        heading.addEventListener(
            "click",
            function() {

                section.classList.toggle(
                    "collapsed"
                );


                if (
                    section.classList.contains(
                        "collapsed"
                    )
                ) {

                    grid.style.display =
                        "none";

                }

                else {

                    grid.style.display =
                        "flex";

                }

            }
        );


        songLibrary.appendChild(
            section
        );

    }

}

// =====================================================
// PLAY SONG
// =====================================================
//
// fromHistory = true means:
//
// "We're going to a song that already exists
// in the history."
//
// This prevents Previous/Next from creating
// duplicate history entries.
//

function playSong(
    index,
    fromHistory = false
) {

    if (
        index < 0 ||
        index >= songs.length
    ) {

        return;

    }


    const song =
        songs[index];


    currentIndex =
        index;


    // =================================================
    // ADD TO PLAY HISTORY
    // =================================================

    if (
        !fromHistory
    ) {

        // If we previously pressed Previous
        // and then manually selected a new song,
        // delete the old "future" history.

        if (
            historyPosition >= 0 &&
            historyPosition <
                playHistory.length - 1
        ) {

            playHistory =
                playHistory.slice(
                    0,
                    historyPosition + 1
                );

        }


        playHistory.push(
            index
        );


        historyPosition =
            playHistory.length - 1;

    }


    // =================================================
    // LOAD SONG
    // =================================================

    audioPlayer.pause();


    audioPlayer.src =
        song.audio;


    nowArt.src =
        song.art;


    nowTitle.textContent =
        song.title +
        " — " +
        getArtistName(
            song
        );


    progressBar.value =
        0;


    audioPlayer.load();


    audioPlayer.play()
        .catch(
            function(error) {

                console.error(
                    "Playback error:",
                    error
                );

            }
        );

}


// =====================================================
// PLAY / PAUSE
// =====================================================

function togglePlay() {

    if (
        currentIndex === -1
    ) {

        if (
            songs.length > 0
        ) {

            playSong(
                0
            );

        }

        return;

    }


    if (
        audioPlayer.paused
    ) {

        audioPlayer.play()
            .catch(
                function(error) {

                    console.error(
                        "Playback error:",
                        error
                    );

                }
            );

    }

    else {

        audioPlayer.pause();

    }

}


// =====================================================
// NEXT SONG
// =====================================================

function nextSong() {

    // =================================================
    // FIRST:
    // If we are currently somewhere in the history
    // and there is a song after us, go forward in history.
    //
    // Example:
    //
    // A → B → C → D
    //         ↑
    //       Previous
    //
    // Press Next → D
    // =================================================

    if (
        historyPosition >= 0 &&
        historyPosition <
            playHistory.length - 1
    ) {

        historyPosition++;


        const nextHistoryIndex =
            playHistory[
                historyPosition
            ];


        playSong(
            nextHistoryIndex,
            true
        );


        return;

    }


    // =================================================
    // SECOND:
    // PLAY QUEUE
    // =================================================

    if (
        queue.length > 0
    ) {

        const nextIndex =
            queue.shift();


        updateQueue();


        playSong(
            nextIndex
        );


        return;

    }


    // =================================================
    // THIRD:
    // NORMAL ARRAY ORDER
    // =================================================

    if (
        songs.length === 0
    ) {

        return;

    }


    let nextIndex =
        currentIndex + 1;


    if (
        nextIndex >= songs.length
    ) {

        nextIndex = 0;

    }


    playSong(
        nextIndex
    );

}


// =====================================================
// PREVIOUS SONG
// =====================================================
//
// IMPORTANT:
//
// This does NOT use:
//
// currentIndex - 1
//
// Instead, it uses the actual play history.
//
// Example:
//
// songs array:
//
// A, B, C, D
//
// Actual playback:
//
// A → C → D → B
//
// History:
//
// [A, C, D, B]
//
// Previous from B → D
// Previous from D → C
// Previous from C → A
//

function previousSong() {

    if (
        playHistory.length === 0
    ) {

        return;

    }


    // We can move backwards in history

    if (
        historyPosition > 0
    ) {

        historyPosition--;


        const previousIndex =
            playHistory[
                historyPosition
            ];


        playSong(
            previousIndex,
            true
        );


        return;

    }


    // Already at the beginning of history.
    // Do nothing.

}


// =====================================================
// LOOP
// =====================================================

function toggleLoop() {

    loopSong =
        !loopSong;


    const loopButton =
        document.getElementById(
            "loopButton"
        );


    loopButton.classList.toggle(
        "active",
        loopSong
    );

}


// =====================================================
// PROGRESS BAR
// =====================================================

audioPlayer.addEventListener(
    "timeupdate",
    function() {

        if (
            !audioPlayer.duration ||
            isNaN(
                audioPlayer.duration
            )
        ) {

            return;

        }


        const percentage =
            (
                audioPlayer.currentTime /
                audioPlayer.duration
            ) * 100;


        progressBar.value =
            percentage;

    }
);


// =====================================================
// SONG FINISHED
// =====================================================

audioPlayer.addEventListener(
    "ended",
    function() {

        if (
            loopSong
        ) {

            audioPlayer.currentTime =
                0;


            audioPlayer.play()
                .catch(
                    function(error) {

                        console.error(
                            "Playback error:",
                            error
                        );

                    }
                );

        }

        else {

            nextSong();

        }

    }
);


// =====================================================
// ADD TO QUEUE
// =====================================================

function addToQueue(
    index
) {

    if (
        index < 0 ||
        index >= songs.length
    ) {

        return;

    }


    queue.push(
        index
    );


    updateQueue();

}
// =====================================================
// DOWNLOAD SONG
// =====================================================

async function downloadSong(index) {

    if (
        index < 0 ||
        index >= songs.length
    ) {

        return;

    }


    const song =
        songs[index];


    try {

        // Get the MP3 file

        const response =
            await fetch(
                song.audio
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Could not download the MP3."
            );

        }


        // Turn the MP3 into a file/blob

        const blob =
            await response.blob();


        // Create a temporary URL

        const url =
            URL.createObjectURL(
                blob
            );


        // Create temporary download link

        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            song.title + ".mp3";


        document.body.appendChild(
            link
        );


        // Start download

        link.click();


        // Clean everything up

        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );

    }

    catch (
        error
    ) {

        console.error(
            "Download failed:",
            error
        );


        alert(
            "The song could not be downloaded."
        );

    }

}


// =====================================================
// COPY SONG URL
// =====================================================

function copySongUrl(index) {

    if (
        index < 0 ||
        index >= songs.length
    ) {

        return;

    }

    const song =
        songs[index];

    navigator.clipboard.writeText(
        song.audio
    )
  
    .catch(
        function(error) {

            console.error(
                "Could not copy URL:",
                error
            );

            alert(
                "Could not copy URL."
            );

        }
    );

}


// =====================================================
// UPDATE QUEUE
// =====================================================

function updateQueue() {

    const queueList =
        document.getElementById(
            "queueList"
        );


    queueList.innerHTML =
        "";


    if (
        queue.length === 0
    ) {

        const empty =
            document.createElement(
                "div"
            );


        empty.textContent =
            "Queue is empty";


        empty.style.color =
            "#666";


        empty.style.fontSize =
            "20px";


        queueList.appendChild(
            empty
        );


        return;

    }


    for (
        let position = 0;
        position < queue.length;
        position++
    ) {

        const index =
            queue[position];


        const song =
            songs[index];


        const item =
            document.createElement(
                "div"
            );


        item.className =
            "queue-song";


        const name =
            document.createElement(
                "span"
            );


        name.className =
            "queue-song-name";


        name.textContent =
            (
                position + 1
            ) +
            ". " +
            song.title;


        const removeButton =
            document.createElement(
                "button"
            );


        removeButton.className =
            "queue-remove";


        removeButton.textContent =
            "×";


        removeButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();


                removeFromQueue(
                    position
                );

            }
        );


        item.addEventListener(
            "click",
            function() {

                playQueuedSong(
                    position
                );

            }
        );


        item.appendChild(
            name
        );


        item.appendChild(
            removeButton
        );


        queueList.appendChild(
            item
        );

    }

}


// =====================================================
// PLAY SONG FROM QUEUE
// =====================================================

function playQueuedSong(
    position
) {

    if (
        position < 0 ||
        position >= queue.length
    ) {

        return;

    }


    const index =
        queue[position];


    queue.splice(
        position,
        1
    );


    updateQueue();


    // This is a normal new playback,
    // so it gets added to history.

    playSong(
        index
    );

}


// =====================================================
// REMOVE FROM QUEUE
// =====================================================

function removeFromQueue(
    position
) {

    if (
        position < 0 ||
        position >= queue.length
    ) {

        return;

    }


    queue.splice(
        position,
        1
    );


    updateQueue();

}


// =====================================================
// CLEAR QUEUE
// =====================================================

function clearQueue() {

    queue = [];


    updateQueue();

}

// =====================================================
// QUEUE COLLAPSE
// =====================================================

document.addEventListener("DOMContentLoaded", function () {

    const queueBox = document.getElementById("queueBox");
    const queueToggle = document.getElementById("queueToggle");

    // Stop here if the queue elements don't exist
    if (!queueBox || !queueToggle) {
        return;
    }

    queueToggle.addEventListener("click", function (event) {

        event.stopPropagation();

        const isCollapsed =
            queueBox.classList.toggle("collapsed");

        queueToggle.textContent =
            isCollapsed ? "▲" : "▼";

    });

});
// =====================================================
// SHUFFLE
// =====================================================

function shuffleSongs() {

    queue = [];


    for (
        let index = 0;
        index < songs.length;
        index++
    ) {

        if (
            songs[index]
                .excludeFromShuffle
        ) {

            continue;

        }


        queue.push(
            index
        );

    }


    // Fisher-Yates shuffle

    for (
        let i = queue.length - 1;
        i > 0;
        i--
    ) {

        const random =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        const temporary =
            queue[i];


        queue[i] =
            queue[random];


        queue[random] =
            temporary;

    }


    updateQueue();


    nextSong();

}


// =====================================================
// SORTING
// =====================================================

sortSelect.addEventListener(
    "change",
    function() {

        createSongCards();

    }
);


// =====================================================
// INITIALIZE
// =====================================================

createSongCards();


updateQueue();

</script>
